<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 520" role="img" aria-labelledby="title desc">
  <title id="title">IMV Services logo</title>
  <desc id="desc">Editable IMV Services lockup set in Halyard Display.</desc>
  <defs>
    <linearGradient id="imv-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4df"/>
      <stop offset="1" stop-color="#e4bd83"/>
    </linearGradient>
  </defs>
  <text x="70" y="375" fill="url(#imv-gold)" font-family="halyard-display-variable, Halyard Display, Arial, sans-serif" font-size="390" font-weight="700" letter-spacing="-36">IMV</text>
  <text x="940" y="345" fill="url(#imv-gold)" font-family="halyard-display-variable, Halyard Display, Arial, sans-serif" font-size="220" font-weight="700" letter-spacing="-18">SERVICES</text>
</svg>
